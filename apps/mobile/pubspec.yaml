name: ngo_app
description: "NGO management and donation app (Android & iOS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_appauth: ^12.1.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  file_picker: ^13.3.0
  share_plus: ^13.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
