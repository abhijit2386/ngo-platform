# Tuned for an 8 GB developer laptop (template default was -Xmx8G).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
# Project (D:) and pub cache (C:) are on different drives: Kotlin incremental caches crash; in-process also saves RAM.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
systemProp.java.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
