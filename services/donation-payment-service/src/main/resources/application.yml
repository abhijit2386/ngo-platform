spring:
  application:
    name: donation-payment-service
  config:
    import: classpath:commons-defaults.yml
server:
  port: ${PORT:8086}
ngo:
  db-name: donation
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    bucket: ${S3_BUCKET:ngo-donations}
    access-key: ${S3_ACCESS_KEY:dev-access}
    secret-key: ${S3_SECRET_KEY:dev-secret-change-me}
  payments:
    mock-enabled: ${PAYMENTS_MOCK_ENABLED:true}
    mock-webhook-secret: ${PAYMENTS_MOCK_SECRET:dev-payments-webhook-secret-change-me}
    min-amount: 10.00
    max-amount: 1000000.00
    order-expiry: PT30M
  donors:
    # donor-service (NGO donor CRM) is not deployed yet; enable when it is.
    resolve-enabled: ${DONOR_RESOLVE_ENABLED:false}
