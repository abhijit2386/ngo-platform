spring:
  application:
    name: receipt-service
  config:
    import: classpath:commons-defaults.yml
server:
  port: ${PORT:8087}
ngo:
  db-name: receipt
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    bucket: ${S3_BUCKET:ngo-receipts}
    access-key: ${S3_ACCESS_KEY:dev-access}
    secret-key: ${S3_SECRET_KEY:dev-secret-change-me}
  receipts:
    link-secret: ${RECEIPT_LINK_SECRET:dev-receipt-link-secret-change-me}
    link-ttl: P30D
    public-base-url: ${PUBLIC_API_BASE:http://localhost:8080}
