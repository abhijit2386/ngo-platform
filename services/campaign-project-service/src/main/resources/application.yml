spring:
  application:
    name: campaign-project-service
  config:
    import: classpath:commons-defaults.yml
server:
  port: ${PORT:8088}
ngo:
  db-name: campaign
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    bucket: ${S3_BUCKET:ngo-campaigns}
    access-key: ${S3_ACCESS_KEY:dev-access}
    secret-key: ${S3_SECRET_KEY:dev-secret-change-me}
  campaigns:
    # Development only: lets staff credit test donations to a live campaign until online payments exist.
    test-donations: ${CAMPAIGN_TEST_DONATIONS:false}
